<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简历 · 赵梁君 Zia</title>
<link rel="stylesheet" href="assets/site.css" />
<style>
  /* 独立简历页：沿用全站暖米白，不引入新配色 */
  body[data-page="resume"]{
    --bg:#F3EFE6;--fg:#26231E;--muted:#7A7367;--line:#DCD6C9;
    --accent:#8A6A4B;--surface:#E7E2D7;--card:#FBF8F1;
    background:var(--bg);color:var(--fg);
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 32px;}
  .bar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 0;background:var(--bg);border-bottom:1px solid var(--line);
    font-size:12px;color:var(--muted);
  }
  .bar a{color:var(--fg);}
  .bar a:hover{color:var(--accent);}
  .bar .actions{display:flex;align-items:center;gap:14px;}
  .bar button{
    font:inherit;font-size:12px;color:var(--fg);background:none;
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .bar button:hover{border-color:var(--accent);color:var(--accent);}
  .paper{
    margin:34px 0 80px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:46px 54px 52px;box-shadow:0 20px 50px rgba(90,66,32,.08);
  }
  .resume h1{
    font-family:Georgia,"Songti SC","Times New Roman",serif;
    font-size:40px;font-weight:400;letter-spacing:-.04em;line-height:1.2;margin-bottom:8px;
  }
  .resume h2{
    font-size:16px;font-weight:600;letter-spacing:.03em;color:var(--accent);
    margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .resume h3{font-size:14.5px;font-weight:600;margin:22px 0 8px;line-height:1.6;}
  .resume p{margin:8px 0;font-size:13px;line-height:1.85;}
  .resume ul{margin:8px 0 14px 20px;}
  .resume li{margin:6px 0;font-size:13px;line-height:1.8;}
  .resume strong{font-weight:600;}
  .resume code{
    font-family:ui-monospace,Consolas,monospace;font-size:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  }
  .resume a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .tip{
    margin-top:28px;border:1px dashed var(--line);border-radius:12px;
    padding:13px 17px;font-size:11.5px;line-height:1.8;color:var(--muted);
  }
  @media(max-width:700px){
    .wrap{padding:0 16px;}
    .bar .actions span{display:none;}
    .paper{margin-top:18px;padding:26px 20px 32px;}
    .resume h1{font-size:32px;}
  }
  @media print{
    .bar,.tip{display:none!important;}
    .paper{border:none;box-shadow:none;margin:0;padding:0;}
    body{background:#fff;}
  }
</style>
</head>
<body data-page="resume">

<div class="wrap">
  <div class="bar">
    <a href="about.html">← 返回关于我</a>
    <div class="actions">
      <span>简历 · markdown 预览版</span>
      <button type="button" id="printBtn">打印 / 存为 PDF</button>
    </div>
  </div>

  <div class="paper">
    <div class="resume" id="resume"><div class="tip">正在读取简历…</div></div>
    <div class="tip">当前展示的是 markdown 版本，用于先看效果；后续换成正式 PDF 后，关于页的简历按钮会直接指向 PDF。</div>
  </div>
</div>

<script>
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => s
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

  function render(md){
    const L = md.replace(/\r/g,"").split("\n");
    let out = "", list = null;
    const closeList = () => { if(list){ out += "</" + list + ">"; list = null; } };
    for(const raw of L){
      const t = raw.trim();
      if(!t){ closeList(); continue; }
      const h = t.match(/^(#{1,4})\s+(.*)$/);
      if(h){ closeList(); const n = h[1].length; out += "<h" + n + ">" + inline(esc(h[2])) + "</h" + n + ">"; continue; }
      const ul = t.match(/^[-*+]\s+(.*)$/);
      if(ul){ if(list !== "ul"){ closeList(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(esc(ul[1])) + "</li>"; continue; }
      closeList(); out += "<p>" + inline(esc(t)) + "</p>";
    }
    closeList(); return out;
  }

  fetch("docs/resume.md")
    .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(md => { document.getElementById("resume").innerHTML = render(md); })
    .catch(e => {
      document.getElementById("resume").innerHTML =
        '<div class="tip"><b>简历读取失败。</b><br/>请用本地预览服务打开本页（不要双击文件）。<br/>' +
        '也可直接查看原始文件：<a href="docs/resume.md">docs/resume.md</a><br/>' + esc(e.message) + '</div>';
    });

  document.getElementById("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
